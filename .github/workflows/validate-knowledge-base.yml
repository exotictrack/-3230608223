name: Validate infographic knowledge base
on:
  push:
  pull_request:
jobs:
  check-documents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate internal links, sections, and image placement
        run: python scripts/validate_repo.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate SC-IMG specifications and prompt exports
        run: node 06-SC-IMG风格分析与克隆/tools/verify.cjs
